algorithm: RiskShield-PPO
base_algorithm: PPO
environment: configs/grid/site_medium.yaml
seed: 42
total_timesteps: 30000
learning_rate: 0.0003
n_steps: 512
batch_size: 128
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
safety_budget: 5.0
constraint_threshold: 5.0
lagrange_initial_value: 0.0
lagrange_learning_rate: 0.02
lagrange_maximum: 100.0
cost_value_learning_rate: 0.001
checkpoint_frequency: 10000
early_stopping_patience_episodes: 50
minimum_episodes_before_stopping: 30
shield_during_training: false
predictive_shield_horizon: 3
device: cuda
resume: true
